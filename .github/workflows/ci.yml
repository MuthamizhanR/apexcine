name: ApexCine Camera OS CI & APK Build

on:
  push:
    branches: [ main, '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run C++20 Camera OS Host Unit Tests & 4K24 KPI Benchmark
        run: |
          cmake -S app/src/main/cpp -B build_cpp -DBUILD_TESTING=ON
          cmake --build build_cpp -j$(nproc)
          ctest --test-dir build_cpp --output-on-failure -V

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK 36.1, NDK 28 & CMake 3.22.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK & Run JUnit / Robolectric Tests
        run: |
          gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Verify Android 15/16 16KB ELF Page Alignment on arm64-v8a Native Engine
        run: |
          readelf -l app/build/intermediates/cxx/Debug/*/obj/arm64-v8a/libapexcine_camera_os.so | grep -E "LOAD|Align" -A 1

      - name: Upload Phone-Ready Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apexcine-camera-os-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
